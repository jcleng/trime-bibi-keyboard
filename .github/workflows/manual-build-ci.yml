# 个人 fork 的手动构建：产出 debug APK，并发布到 GitHub Releases。
# 每次运行都会覆盖同一个 tag（默认 debug-latest），保持该 Release 上始终是最新构建。
name: Manual Build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布使用的 tag 名（同一 tag 会被覆盖更新）'
        required: false
        default: 'debug-latest'
      prerelease:
        description: '标记为预发布 (prerelease)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

env:
  CI_NAME: Manual Build CI
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_ABI: arm64-v8a,armeabi-v7a,x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install CMake
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Fetch SenseVoice model
        run: |
          bash script/fetch-sensevoice-model.sh

      - name: Restore fixed signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TRIME_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::TRIME_KEYSTORE_BASE64 secret is not set; refusing to build an unsigned/randomly-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fixed.keystore"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/fixed.keystore
          storePassword=${{ secrets.TRIME_KEYSTORE_STORE_PASSWORD }}
          keyAlias=${{ secrets.TRIME_KEYSTORE_KEY_ALIAS }}
          keyPassword=${{ secrets.TRIME_KEYSTORE_KEY_PASSWORD }}
          EOF

      - name: Build debug Trime
        run: |
          make debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: trime-debug-apk
          path: app/build/outputs/apk/debug/
          retention-days: 30

      - name: Collect release notes
        id: meta
        shell: bash
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: Publish to Releases
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.release_tag || 'debug-latest' }}
          name: Debug build (${{ steps.meta.outputs.short_sha }})
          prerelease: ${{ inputs.prerelease }}
          allowUpdates: true
          # 覆盖同一 tag 上的旧资产，避免重复上传失败
          removeArtifacts: true
          replacesArtifacts: true
          artifacts: "app/build/outputs/apk/debug/*.apk"
          artifactErrorsFailBuild: true
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Debug APK built from `${{ github.ref_name }}` at `${{ steps.meta.outputs.short_sha }}`.

            **Commit:** ${{ steps.meta.outputs.subject }}

            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            > Debug 构建，使用测试签名；与已安装的正式版包名不同（后缀 `.debug`），可共存安装。
